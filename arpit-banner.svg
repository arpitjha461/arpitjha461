<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#170e28"/>
      <stop offset="100%" stop-color="#2a1547"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E2DE2"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#c084fc"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="260" fill="url(#bg)"/>

  <!-- floating sparkles -->
  <circle cx="80" cy="60" r="2.5" fill="#EC4899">
    <animate attributeName="cy" values="60;40;60" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="200" r="3" fill="#c084fc">
    <animate attributeName="cy" values="200;175;200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="60" r="2" fill="#8E2DE2">
    <animate attributeName="cy" values="60;80;60" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="210" r="2" fill="#EC4899">
    <animate attributeName="cy" values="210;190;210" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- terminal line -->
  <text x="450" y="70" font-family="Fira Code, monospace" font-size="16" fill="#9ca3af" text-anchor="middle">
    arpit@software-engineer:~$ cat README.md
  </text>

  <!-- name with glow -->
  <text x="450" y="140" font-family="Georgia, serif" font-size="52" font-weight="bold"
        text-anchor="middle" fill="url(#nameGrad)" filter="url(#glow)">
    Arpit Vishwakarma
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <!-- underline glow bar -->
  <rect x="250" y="160" width="400" height="2" fill="url(#nameGrad)" filter="url(#glow)">
    <animate attributeName="width" values="0;400;400" dur="2s" fill="freeze"/>
  </rect>

  <!-- subtitle -->
  <text x="450" y="195" font-family="Fira Code, monospace" font-size="18" fill="#c084fc" text-anchor="middle">
    Software Engineer @ Infosys · Automation &amp; API Testing
  </text>

  <!-- tagline -->
  <text x="450" y="230" font-family="Fira Code, monospace" font-size="14" fill="#ec4899" text-anchor="middle" font-style="italic">
    "I don't just test software, I break it before it breaks in production."
  </text>
</svg>
